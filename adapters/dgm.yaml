slug: dgm
name: Darwin Gödel Machine
repository: jennyzzt/dgm
priority: S
coverage: supported
tag_pattern: ^v?\d+\.\d+\.\d+$
rules:
- glob: prompts/self_improvement_prompt.py
  module: evolution
  format: python
  key_pattern: PROMPT|INSTRUCTION|SYSTEM
- glob: prompts/diagnose_improvement_prompt.py
  module: reflection
  format: python
  key_pattern: PROMPT|INSTRUCTION|SYSTEM
- glob: prompts/testrepo_prompt.py
  module: evaluation
  format: python
  min_chars: 60
- glob: prompts/tooluse_prompt.py
  module: tools
  format: python
  min_chars: 60
limitations:
- 上游以 main 代替版本发布；静态归档自改进诊断和 benchmark 提示词，不运行源码修改、测评或候选选择。
